server {
    listen 80;
    server_name localhost;

    # Решает проблему 413: разрешаем загружать файлы до 100 МБ
    client_max_body_size 0;

    # 1. Все запросы на /api/ перенаправляем в бэкенд (API Gateway)
    # 'nginx' - это имя сервиса твоего Gateway в docker-compose.yml
    location /api/ {
        proxy_pass http://nginx:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Все остальные запросы отдаем Vue-роутеру
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }
}